name: Actualizar conflicto actual (Ciencia Política)

on:
  schedule:
    # Lunes 09:00 UTC = 06:00 Argentina
    - cron: "0 9 * * 1"
  # Permite dispararlo a mano desde la pestaña Actions, para probar
  # sin esperar a la corrida semanal.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-conflicto:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Etapa 1 — scraping del RSS (sin IA)
        run: npm run scrape

      - name: Etapa 2a — categorización con Gemini
        run: npm run categorizar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Etapa 2b — adaptación de la noticia con Gemini
        run: npm run adaptar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Etapa 3 — publicar solo si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/conflicto-actual.json; then
            echo "Sin cambios en conflicto-actual.json, no se commitea nada."
          else
            git add data/conflicto-actual.json
            git commit -m "chore: actualizar conflicto-actual.json [automático]"
            git push
          fi
